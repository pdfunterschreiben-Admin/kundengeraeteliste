# Baut bei jedem Push auf main die Kundengeraeteliste.exe.
# Steht in der Datei VERSION eine neue Versionsnummer, wird daraus ein GitHub-Release
# (Tag vX.Y.Z) – das holen sich die installierten Programme als Update.
# Versionsnummer mit Bindestrich (z. B. 1.1.0-test1) = Testversion (Pre-release),
# die nur Rechner mit "Testversionen erhalten" bekommen.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Version lesen
        id: v
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "neu=false" >> "$GITHUB_OUTPUT"; else echo "neu=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Testen
        run: go test ./...
      - name: Bauen
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui -X main.Version=${{ steps.v.outputs.version }}" -o Kundengeraeteliste.exe .
      - name: Release
        if: steps.v.outputs.neu == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Kundengeräteliste ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Kundengeraeteliste.exe
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          generate_release_notes: true
