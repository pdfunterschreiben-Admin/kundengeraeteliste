<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3172d"/><stop offset="1" stop-color="#b30c1f"/>
    </linearGradient>
  </defs>
  <!-- Grundform wie das Truck-Report-Symbol -->
  <rect x="8" y="8" width="240" height="240" rx="50" fill="url(#g)"/>
  <!-- Klemmbrett -->
  <rect x="50" y="46" width="156" height="178" rx="18" fill="#fff"/>
  <rect x="94" y="28" width="68" height="34" rx="11" fill="#fff"/>
  <rect x="110" y="39" width="36" height="10" rx="5" fill="#c4101f"/>
  <!-- Gabelstapler (Seitenansicht, fährt nach rechts) -->
  <g fill="#c4101f">
    <!-- Mast mit Hubschlitten -->
    <rect x="150" y="64" width="6" height="98" rx="2"/>
    <rect x="159" y="64" width="6" height="98" rx="2"/>
    <rect x="146" y="112" width="24" height="7" rx="2"/>
    <!-- Gabelzinken -->
    <path d="M148 150 h46 q4 0 4 4 q0 4 -4 4 h-46 z"/>
    <!-- Palette und Last -->
    <rect x="166" y="140" width="30" height="7" rx="1.5" opacity=".75"/>
    <rect x="170" y="116" width="22" height="24" rx="3" opacity=".5"/>
    <!-- Fahrzeugkörper mit Gegengewicht -->
    <path d="M60 152 V124 q0-12 12-12 h14 v-4 h28 l12 18 v26 z"/>
    <!-- Sitz -->
    <rect x="90" y="92" width="7" height="20" rx="2"/>
    <rect x="90" y="104" width="22" height="7" rx="2"/>
  </g>
  <!-- Fahrerschutzdach -->
  <path d="M82 108 V78 H130 V100" fill="none" stroke="#c4101f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="78" y="72" width="58" height="7" rx="3" fill="#c4101f"/>
  <!-- Lenkrad -->
  <path d="M122 110 L116 92" stroke="#c4101f" stroke-width="4" stroke-linecap="round"/>
  <!-- Räder -->
  <circle cx="84" cy="156" r="13" fill="#c4101f" stroke="#fff" stroke-width="3"/><circle cx="84" cy="156" r="4.5" fill="#fff"/>
  <circle cx="128" cy="154" r="16" fill="#c4101f" stroke="#fff" stroke-width="3"/><circle cx="128" cy="154" r="5.5" fill="#fff"/>
  <!-- Listenzeilen -->
  <rect x="72" y="180" width="112" height="10" rx="5" fill="#c4101f" opacity=".85"/>
  <rect x="72" y="198" width="76" height="10" rx="5" fill="#c4101f" opacity=".4"/>
</svg>
